optimization: # the subdicts correspond to different optimization modes
  stochastic_design:
    MIP_gap: 0.005    # - | relative optimality gap of MIP model
    solver_options: # options for gurobi solver
      ResultFile: 'model.ilp'
      LogToConsole: 1
      OutputFlag: 1
    timelimit: 86400 # seconds, one day
    custom_logFile: 'gurobi.log'
  deterministic_operation:
    MIP_gap: 0.0005    
    solver_options:
      ResultFile: 'model.ilp'
      LogToConsole: 1
      OutputFlag: 1
    timelimit: 3600 # seconds
    # custom_logFile: None
  deterministic_design:
    MIP_gap: 0.005
    solver_options:
      ResultFile: 'model.ilp'
      LogToConsole: 1
      OutputFlag: 1
    timelimit: 3600 # seconds
    # custom_logFile: None
  max_overcapacity:
    MIP_gap: 0.005
    solver_options:
      ResultFile: 'model.ilp'
      LogToConsole: 1
      OutputFlag: 1
    timelimit: 3600 # seconds
  feasible_hull:
    MIP_gap: 0.005
    solver_options:
      ResultFile: 'model.ilp'
      LogToConsole: 1
      OutputFlag: 1
    timelimit: 3600 # seconds
  near_optimal:
    MIP_gap: 0.005
    solver_options:
      ResultFile: 'model.ilp'
      LogToConsole: 1
      OutputFlag: 1
    timelimit: 3600 # seconds
time_series_aggregation:
  noTypicalPeriods: 5
  hoursPerPeriod: 24
  segmentation: False
  clusterMethod: 'hierarchical'
  total_hours: 8760 # number of hours which should be represented by the aggregated timeseries. Is not necessarily equal to the number of hours in the input timeseries.
  tsa_path:  'timeseries_tsa_export' # Relative path from DATA_IN
  load_tsa_inputs: False
  extremePeriodMethod: 'None' # if a method other than 'None' is selected, extreme
  # periods are included for products with 'include_extreme_demand_peroid' in products.yaml
config_uncertainties:
  name_uncertainties: 'no_uncertainty' # 'uncertainties_only_el' #'uncertainties_standard' # definition, which uncertainties are used from uncerainties.yaml
  uncertain_parameter_names: []
timeseries_scaling: 'standard' # key from time_series_scaling.yaml
model_formulation: 'LP' # 'MILP' or 'LP'
superstructure_name: 'superstructure_JP1_8D'
N_scenarios: 5
seed: 0
